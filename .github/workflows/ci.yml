name: SmartAulaUES CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: siaa_test
          POSTGRES_USER: siaa
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U siaa -d siaa_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: siaa_test
      DB_USERNAME: siaa
      DB_PASSWORD: ci-only-password
      DEMO_SEED: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated test environment
        run: cp .env.testing.example .env.testing
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, mbstring, xml, gd, zip, intl, bcmath
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: composer install --prefer-dist --no-interaction
      - run: composer validate --strict
      - run: composer check-platform-reqs
      - run: vendor/bin/pint --test
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: php scripts/check-test-database.php
      - run: php artisan test --compact --display-warnings --fail-on-warning
      - run: php scripts/verify-a05-upgrade.php --env=testing
      - run: php tests/Concurrency/attendance-races.php --env=testing
      - run: php tests/Concurrency/attendance-summary.php --env=testing
      - run: php tests/Concurrency/academic-closures.php --env=testing
      - run: php tests/Concurrency/offering-management.php --env=testing
      - run: php tests/Concurrency/a05-integration.php --env=testing
